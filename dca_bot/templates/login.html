<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · DCA Bot</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-shell"><main class="login-card"><div class="brand-mark">D</div><p class="eyebrow">PRIVATE TRADING CONSOLE</p><h1>Welcome back</h1><p class="muted">Sign in to access your DCA workspace.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Dashboard password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button primary full" type="submit">Unlock dashboard <span>↗</span></button></form><p class="footnote">Live trading is disabled by default.</p></main></body></html>
