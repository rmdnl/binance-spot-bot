[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-spot-terminal"
version = "0.1.0"
description = "Self-hosted Binance Spot Trading Terminal with manual trading and grid execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.5,<3.0",
  "itsdangerous>=2.2,<3.0",
  "passlib[bcrypt]>=1.7.4",
  "ccxt>=4.4,<5.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["dca_bot*"]

[tool.setuptools.package-data]
dca_bot = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
