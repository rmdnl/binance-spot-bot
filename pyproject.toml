[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-spot-bot"
version = "0.2.0"
description = "Self-hosted Binance Spot trading terminal with manual trading and grid execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.5,<3.0",
  "itsdangerous>=2.2,<3.0",
  "passlib[bcrypt]>=1.7.4",
  "ccxt>=4.4,<5.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["spot_bot*"]

[tool.setuptools.package-data]
spot_bot = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# These rules are intentionally disabled for this application layer. The
# FastAPI dependency pattern (B008), deliberate API exception boundaries
# (BLE001), immutable Decimal defaults (RUF009), Decimal readability checks
# (FURB157), import ordering (I001), nested validation branches (SIM102),
# and forward-reference cleanup (UP037) do not change trading behavior.
ignore = ["B008", "BLE001", "FURB157", "I001", "RUF009", "SIM102", "UP037"]
